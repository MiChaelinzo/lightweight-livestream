name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyinstaller
      - run: python -m unittest discover -s tests
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true
      - name: Write combined checksums
        working-directory: assets
        run: |
          sha256sum *.zip *.tar.gz *.dmg 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "LightStream $GITHUB_REF_NAME" --generate-notes
