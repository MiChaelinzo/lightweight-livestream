name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            architecture: x86_64
          - os: macos-15
            target: macos
            architecture: arm64
          - os: ubuntu-22.04
            target: linux
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record and verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual=$(python -c "import platform; print({'AMD64':'x86_64','x86_64':'x86_64','arm64':'arm64','aarch64':'arm64'}.get(platform.machine(), platform.machine()))")
          echo "Runner: $RUNNER_OS / $actual; expected ${{ matrix.target }} / ${{ matrix.architecture }}"
          test "$actual" = "${{ matrix.architecture }}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Check version and tag provenance
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_version.py
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/check_version.py --expect "${GITHUB_REF_NAME#v}"
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Tag does not resolve to the checked-out commit." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "Tag commit is not reachable from origin/main." >&2
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME resolves to merged commit $tag_commit"
          fi
      - name: Install pinned release builder
        run: python -m pip install pyinstaller==6.11.1
      - name: Install WiX 5
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          tool="$RUNNER_TEMP/appimagetool"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$tool"
          echo "e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  $tool" | sha256sum --check --strict
          chmod 0755 "$tool"
          echo "LIGHTSTREAM_APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
      - name: Configure optional Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            if (-not [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
              throw "WINDOWS_CERTIFICATE_PASSWORD is set without WINDOWS_CERTIFICATE_PFX_BASE64"
            }
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is set without WINDOWS_CERTIFICATE_PASSWORD"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "lightstream-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw "signtool.exe was not found" }
          "LIGHTSTREAM_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIGHTSTREAM_WINDOWS_CERTIFICATE_PASSWORD=$env:PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIGHTSTREAM_SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure optional macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" ]]; then
            if [[ -n "$P12_PASSWORD$APP_IDENTITY$INSTALLER_IDENTITY$NOTARY_APPLE_ID$NOTARY_TEAM_ID$NOTARY_PASSWORD" ]]; then
              echo "macOS signing secrets are only partially configured." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ -z "$P12_PASSWORD" || -z "$APP_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "macOS signing needs certificate, password, app identity, and installer identity." >&2
            exit 1
          fi
          notary_count=0
          [[ -n "$NOTARY_APPLE_ID" ]] && notary_count=$((notary_count + 1))
          [[ -n "$NOTARY_TEAM_ID" ]] && notary_count=$((notary_count + 1))
          [[ -n "$NOTARY_PASSWORD" ]] && notary_count=$((notary_count + 1))
          if [[ "$notary_count" != 0 && "$notary_count" != 3 ]]; then
            echo "All three macOS notarization secrets must be set together." >&2
            exit 1
          fi
          p12="$RUNNER_TEMP/lightstream-signing.p12"
          keychain="$RUNNER_TEMP/lightstream-signing.keychain-db"
          keychain_password=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          P12_PATH="$p12" python -c 'import base64, os; open(os.environ["P12_PATH"], "wb").write(base64.b64decode(os.environ["P12_BASE64"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "LIGHTSTREAM_MACOS_APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "LIGHTSTREAM_MACOS_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "LIGHTSTREAM_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [[ "$notary_count" == 3 ]]; then
            xcrun notarytool store-credentials lightstream-notary --keychain "$keychain" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
            echo "LIGHTSTREAM_MACOS_NOTARY_PROFILE=lightstream-notary" >> "$GITHUB_ENV"
          fi
      - name: Run Python tests
        run: python -m unittest discover -s tests
      - name: Run Node tests
        run: node --test "web/test/*.test.js"
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check preset parity
        run: python tools/export_presets.py --check
      - name: Check generated icons
        run: python tools/generate_icons.py --check
      - name: Run source self-test
        run: python -m lightstream gui --self-test --self-test-json
        env:
          PYTHONPATH: src
      - name: Build native release artifacts
        run: python tools/build_release.py --platform ${{ matrix.target }} --architecture ${{ matrix.architecture }}
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/lightstream-signing.pfx" "$RUNNER_TEMP/lightstream-signing.p12"
          if [[ "$RUNNER_OS" == "macOS" && -f "$RUNNER_TEMP/lightstream-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/lightstream-signing.keychain-db"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.architecture }}
          path: |
            dist/release/*.zip
            dist/release/*.msi
            dist/release/*.dmg
            dist/release/*.pkg
            dist/release/*.tar.gz
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/*.rpm
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true
      - name: Validate release set and write combined checksums
        working-directory: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          check_one() {
            local pattern=$1
            local matches=( $pattern )
            if [[ "${#matches[@]}" != 1 ]]; then
              echo "Expected exactly one $pattern artifact; found ${#matches[@]}." >&2
              exit 1
            fi
          }
          check_one 'LightStream-*-windows-x86_64-portable-*.zip'
          check_one 'LightStream-*-windows-x86_64-*.msi'
          check_one 'LightStream-*-macos-arm64-*.zip'
          check_one 'LightStream-*-macos-arm64-*.dmg'
          check_one 'LightStream-*-macos-arm64-*.pkg'
          check_one 'LightStream-*-linux-x86_64.tar.gz'
          check_one 'LightStream-*-linux-x86_64.AppImage'
          check_one 'LightStream-*-linux-x86_64.deb'
          check_one 'LightStream-*-linux-x86_64.rpm'
          files=(*.zip *.msi *.dmg *.pkg *.tar.gz *.AppImage *.deb *.rpm)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "LightStream $GITHUB_REF_NAME" --generate-notes
          fi
